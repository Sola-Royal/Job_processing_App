name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint Code and Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Lint Python with flake8
        run: flake8 api/main.py worker/worker.py --max-line-length=100

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Install eslint
        run: cd frontend && npm install eslint @eslint/js --save-dev

      - name: Lint JavaScript with eslint
        run: cd frontend && npx eslint app.js --rule '{"no-unused-vars": "warn", "no-undef": "warn"}'

      - name: Install hadolint
        run: |
          wget -q -O /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfiles with hadolint
        run: |
          hadolint api/Dockerfile
          hadolint worker/Dockerfile
          hadolint frontend/Dockerfile

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install fastapi uvicorn redis pytest pytest-cov httpx

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v \
            --cov=api \
            --cov-report=xml \
            --cov-report=term

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            localhost:5000/api:${{ github.sha }}
            localhost:5000/api:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: |
            localhost:5000/worker:${{ github.sha }}
            localhost:5000/worker:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            localhost:5000/frontend:${{ github.sha }}
            localhost:5000/frontend:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  security:
    name: Security Scan with Trivy
    runs-on: ubuntu-latest
    needs: build
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Rebuild images for scanning
        run: |
          docker buildx build --push --tag localhost:5000/api:latest ./api
          docker buildx build --push --tag localhost:5000/worker:latest ./worker
          docker buildx build --push --tag localhost:5000/frontend:latest ./frontend

      - name: Install Trivy
        run: |
          wget -q https://github.com/aquasecurity/trivy/releases/download/v0.50.1/trivy_0.50.1_Linux-64bit.deb
          sudo dpkg -i trivy_0.50.1_Linux-64bit.deb

      - name: Scan API image with Trivy
        run: |
          trivy image --exit-code 1 --severity CRITICAL \
            --format sarif --output trivy-api.sarif \
            localhost:5000/api:latest

      - name: Scan Worker image with Trivy
        run: |
          trivy image --exit-code 1 --severity CRITICAL \
            --format sarif --output trivy-worker.sarif \
            localhost:5000/worker:latest

      - name: Scan Frontend image with Trivy
        run: |
          trivy image --exit-code 1 --severity CRITICAL \
            --format sarif --output trivy-frontend.sarif \
            localhost:5000/frontend:latest

      - name: Upload Trivy SARIF results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif-results
          path: "*.sarif"

  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create environment file
        run: |
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> .env
          echo "APP_ENV=production" >> .env
          echo "FRONTEND_PORT=3000" >> .env

      - name: Start full stack with docker compose
        run: docker compose up --build -d

      - name: Wait for all services to be healthy
        run: |
          echo "Waiting for services..."
          for i in $(seq 1 30); do
            UNHEALTHY=$(docker compose ps --format json \
              | python3 -c "
          import sys, json
          lines = [l for l in sys.stdin if l.strip()]
          services = [json.loads(l) for l in lines]
          bad = [s['Name'] for s in services if s.get('Health','') == 'unhealthy']
          print(len(bad))
          ")
            if [ "$UNHEALTHY" = "0" ]; then
              echo "All services healthy!"
              break
            fi
            echo "Attempt $i/30 — waiting..."
            sleep 5
          done

      - name: Run integration test script
        run: bash integration_test.sh

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy Rolling Update
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create environment file
        run: |
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> .env
          echo "APP_ENV=production" >> .env
          echo "FRONTEND_PORT=3000" >> .env

      - name: Start stack
        run: docker compose up --build -d

      - name: Rolling update all services
        run: |
          for SERVICE in api worker frontend; do
            echo "Rolling update: $SERVICE"
            docker compose build $SERVICE
            docker compose up -d --no-deps $SERVICE

            DEADLINE=$((SECONDS + 60))
            while [ $SECONDS -lt $DEADLINE ]; do
              CONTAINER=$(docker compose ps -q $SERVICE)
              HEALTH=$(docker inspect \
                --format='{{.State.Health.Status}}' \
                "$CONTAINER" 2>/dev/null || echo "none")
              echo "$SERVICE health: $HEALTH"
              if [ "$HEALTH" = "healthy" ]; then
                echo "$SERVICE is healthy!"
                break
              fi
              if [ $SECONDS -ge $DEADLINE ]; then
                echo "$SERVICE failed — aborting!"
                exit 1
              fi
              sleep 5
            done
          done
          echo "Rolling update complete!"
