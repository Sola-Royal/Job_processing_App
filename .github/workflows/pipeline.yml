name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint Code and Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Lint Python with flake8
        run: flake8 api/main.py worker/worker.py --max-line-length=100

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies and eslint
        run: |
          cd frontend
          npm install
          npm install eslint @eslint/js globals --save-dev

      - name: Lint JavaScript with eslint
        run: cd frontend && npx eslint app.js

      - name: Install hadolint
        run: |
          sudo wget -q -O /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfiles with hadolint
        run: |
          hadolint api/Dockerfile
          hadolint worker/Dockerfile
          hadolint frontend/Dockerfile

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install fastapi uvicorn redis pytest pytest-cov httpx

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v \
            --cov=api \
            --cov-report=xml \
            --cov-report=term

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build_and_scan:
    name: Build, Push and Security Scan
    runs-on: ubuntu-latest
    needs: test
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build and push images to local registry
        run: |
          docker build -t localhost:5000/api:latest ./api
          docker build -t localhost:5000/worker:latest ./worker
          docker build -t localhost:5000/frontend:latest ./frontend
          docker push localhost:5000/api:latest
          docker push localhost:5000/worker:latest
          docker push localhost:5000/frontend:latest

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: localhost:5000/api:latest
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os

      - name: Scan Worker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: localhost:5000/worker:latest
          format: sarif
          output: trivy-worker.sarif
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os

      - name: Scan Frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: localhost:5000/frontend:latest
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os

      - name: Upload Trivy SARIF results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif-results
          path: "*.sarif"

  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: build_and_scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create environment file
        run: |
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> .env
          echo "APP_ENV=production" >> .env
          echo "FRONTEND_PORT=3000" >> .env

      - name: Start full stack with docker compose
        run: docker compose up --build -d

      - name: Wait for all services to be healthy
        run: |
          echo "Waiting for services..."
          for i in $(seq 1 30); do
            # Using python3 for a robust cross-platform check if jq isn't present
            UNHEALTHY=$(docker compose ps --format json | python3 -c "import sys, json; data=sys.stdin.read(); print(len([s for s in (json.loads(data) if data.startswith('[') else [json.loads(l) for l in data.splitlines()]) if s.get('Health') != 'healthy']))" 2>/dev/null || echo "1")
            if [ "$UNHEALTHY" = "0" ]; then
              echo "All services healthy!"
              break
            fi
            echo "Attempt $i/30 — waiting for services..."
            sleep 5
          done

      - name: Run integration test script
        run: bash integration_test.sh

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy Rolling Update
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create environment file
        run: |
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> .env
          echo "APP_ENV=production" >> .env
          echo "FRONTEND_PORT=3000" >> .env

      - name: Rolling update all services
        run: |
          for SERVICE in api worker frontend; do
            echo "Rolling update: $SERVICE"
            docker compose build $SERVICE
            docker compose up -d --no-deps $SERVICE

            DEADLINE=$((SECONDS + 60))
            while [ $SECONDS -lt $DEADLINE ]; do
              CONTAINER=$(docker compose ps -q $SERVICE)
              HEALTH=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo "none")
              echo "$SERVICE health: $HEALTH"
              if [ "$HEALTH" = "healthy" ]; then
                echo "$SERVICE is healthy!"
                break
              fi
              if [ $SECONDS -ge $DEADLINE ]; then
                echo "$SERVICE failed health check — aborting!"
                exit 1
              fi
              sleep 5
            done
          done
          echo "Rolling update complete!"
